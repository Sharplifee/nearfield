name: iOS build and TestFlight

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          NEWEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $NEWEST"
          sudo xcode-select -s "$NEWEST"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      # Build number = latest TestFlight build + 1. Never collides, never needs a commit.
      - name: Resolve build number
        id: bn
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet pyjwt cryptography requests
          echo "$ASC_KEY_P8" > /tmp/asc.p8
          NEXT=$(/tmp/venv/bin/python <<'PY'
          import jwt,time,requests,os
          k=open("/tmp/asc.p8").read(); now=int(time.time())
          t=jwt.encode({"iss":os.environ["ASC_ISSUER_ID"],"iat":now,"exp":now+900,
                        "aud":"appstoreconnect-v1"},k,algorithm="ES256",
                       headers={"kid":os.environ["ASC_KEY_ID"],"typ":"JWT"})
          h={"Authorization":"Bearer "+t}
          a=requests.get("https://api.appstoreconnect.apple.com/v1/apps",
                         headers=h,params={"filter[bundleId]":"com.connor.nearfield"}).json()
          d=a.get("data",[])
          if not d: print(1); raise SystemExit
          b=requests.get("https://api.appstoreconnect.apple.com/v1/builds",headers=h,
                params={"filter[app]":d[0]["id"],"sort":"-version","limit":1}).json().get("data",[])
          print(int(b[0]["attributes"]["version"])+1 if b else 1)
          PY
          )
          echo "next=$NEXT" >> $GITHUB_OUTPUT
          echo "Building build number $NEXT"

      # A fresh keychain has no WWDR intermediate, so a valid cert reports as revoked.
      # Import WWDR G3 BEFORE the p12, and stop the keychain auto-locking mid-archive.
      - name: Set up signing
        env:
          P12: ${{ secrets.APPLE_DIST_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_DIST_P12_PASSWORD }}
          PROFILE_PHONE: ${{ secrets.APPLE_PROVISION_PROFILE }}
          PROFILE_WATCH: ${{ secrets.APPLE_PROVISION_PROFILE_WATCH }}
        run: |
          KEYCHAIN=$RUNNER_TEMP/build.keychain
          security create-keychain -p ci "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p ci "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain

          curl -sfSL https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer -o /tmp/wwdr.cer
          security import /tmp/wwdr.cer -k "$KEYCHAIN" -T /usr/bin/codesign || true

          echo "$P12" | base64 -d > /tmp/dist.p12
          security import /tmp/dist.p12 -k "$KEYCHAIN" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci "$KEYCHAIN"
          security find-identity -v -p codesigning "$KEYCHAIN"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_PHONE" | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/phone.mobileprovision
          echo "$PROFILE_WATCH" | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/watch.mobileprovision

      - name: Archive
        run: |
          xcodebuild archive \
            -project Nearfield.xcodeproj \
            -scheme Nearfield \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $RUNNER_TEMP/Nearfield.xcarchive \
            CURRENT_PROJECT_VERSION=${{ steps.bn.outputs.next }} \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} \
            OTHER_CODE_SIGN_FLAGS="--keychain $RUNNER_TEMP/build.keychain" \
            -quiet || xcodebuild archive \
            -project Nearfield.xcodeproj -scheme Nearfield -configuration Release \
            -sdk iphoneos -archivePath $RUNNER_TEMP/Nearfield.xcarchive \
            CURRENT_PROJECT_VERSION=${{ steps.bn.outputs.next }} CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} 2>&1 | tail -120 && false

      # Under manual signing, ExportOptions MUST map each bundle id to the profile NAME,
      # or exportArchive fails with "requires a provisioning profile" on a signed archive.
      - name: Export IPA
        run: |
          cat > /tmp/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key><string>manual</string>
            <key>uploadSymbols</key><true/>
            <key>provisioningProfiles</key><dict>
              <key>com.connor.nearfield</key><string>Nearfield CI</string>
              <key>com.connor.nearfield.watchkitapp</key><string>Nearfield Watch CI</string>
            </dict>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/Nearfield.xcarchive \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/export \
            -allowProvisioningUpdates NO

      - uses: actions/upload-artifact@v4
        with:
          name: Nearfield-ipa
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 30

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/private_keys
          echo "$ASC_KEY_P8" > ~/private_keys/AuthKey_$ASC_KEY_ID.p8
          xcrun altool --upload-app -f "$RUNNER_TEMP/export/Nearfield.ipa" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
